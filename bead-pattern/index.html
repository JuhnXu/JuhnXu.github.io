<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>拼豆图纸生成器</title>
  <meta name="description" content="根据图片原始分辨率和目标拼豆尺寸生成拼豆图纸，支持总数量、实体尺寸、颜色统计和 PNG/CSV 导出。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">拼豆图纸生成器</div>
      <div class="subtitle">图片 → 拼豆图纸 · 全程本地处理</div>
    </div>
    <div class="badge">无需上传图片</div>
  </header>

  <main class="layout">
    <aside class="panel controls">
      <section>
        <h2>① 上传图片</h2>
        <label class="dropzone" id="dropzone">
          <input id="fileInput" type="file" accept="image/*">
          <span class="upload-icon">＋</span>
          <strong>点击选择图片</strong>
          <small>也可以直接拖拽图片到这里</small>
        </label>
        <div class="file-name" id="fileName">尚未选择图片</div>
      </section>

      <section>
        <h2>② 处理模式</h2>
        <label>图纸类型
          <select id="renderMode">
            <option value="bead">拼豆图纸（颜色量化）</option>
            <option value="grid">原图 + 网格（不改变原图）</option>
          </select>
        </label>
        <div class="mode-note" id="modeNote">会按拼豆格数重新采样并匹配拼豆颜色。</div>
      </section>

      <section>
        <h2>③ 图纸设置</h2>
        <div class="source-info" id="sourceInfo">上传图片后自动读取原始分辨率</div>
        <label>尺寸模式
          <select id="sizeMode">
            <option value="width">按拼豆宽度</option>
            <option value="total">按拼豆总数量</option>
            <option value="bead">按实物拼豆尺寸</option>
          </select>
        </label>
        <div class="field-row">
          <label>拼豆宽度 <input id="widthInput" type="number" min="5" max="300" value="40"></label>
          <label>拼豆高度 <input id="heightInput" type="number" min="5" max="300" value="40"></label>
        </div>
        <div id="totalSizeField" class="single-field" hidden>
          <label>目标拼豆总数 <input id="totalInput" type="number" min="25" max="90000" value="1600"></label>
        </div>
        <div id="beadSizeField" class="single-field" hidden>
          <label>单颗拼豆尺寸（mm） <input id="beadSizeInput" type="number" min="2" max="20" step="0.1" value="2.6"></label>
        </div>
        <label class="check"><input id="keepRatio" type="checkbox" checked> 保持原图比例</label>
        <label>颜色数量 <output id="colorCountValue">24</output>
          <input id="colorCount" type="range" min="4" max="48" value="24">
        </label>
        <label>颜色库
          <select id="palette">
            <option value="classic">常用拼豆色板（内置）</option>
            <option value="basic">基础色板（12色）</option>
          </select>
        </label>
        <label class="check"><input id="showGrid" type="checkbox" checked> 显示网格线</label>
        <label class="check"><input id="showNumbers" type="checkbox"> 显示颜色编号</label>
        <div id="gridOnlySettings" class="grid-settings" hidden>
          <label>网格列数 <output id="gridColsValue">40</output>
            <input id="gridCols" type="range" min="5" max="200" value="40">
          </label>
          <label>网格线强度 <output id="gridOpacityValue">45%</output>
            <input id="gridOpacity" type="range" min="10" max="100" value="45">
          </label>
          <label>网格线宽度 <output id="gridWidthValue">1 px</output>
            <input id="gridWidth" type="range" min="1" max="5" value="1">
          </label>
        </div>
        <button class="primary" id="generateBtn" disabled>生成拼豆图纸</button>
      </section>

      <section>
        <h2>④ 导出</h2>
        <div class="button-grid">
          <button id="exportPng" disabled>导出 PNG</button>
          <button id="exportCsv" disabled>导出 CSV</button>
        </div>
      </section>

      <section class="tips">
        <h2>使用提示</h2>
        <p>建议先将主体清晰、背景简单的图片转换成图纸。颜色越少，实际拼豆配色越容易采购；格数越大，细节越丰富。</p>
      </section>
    </aside>

    <section class="workspace">
      <div class="workspace-head">
        <div>
          <h1>图纸预览</h1>
          <span id="meta">等待上传图片</span>
        </div>
        <div class="zoom">
          <button id="zoomOut">−</button><span id="zoomValue">100%</span><button id="zoomIn">＋</button>
        </div>
      </div>

      <div class="canvas-wrap" id="canvasWrap">
        <div class="empty">
          <div class="empty-art">▦</div>
          <h3>上传一张图片开始制作</h3>
          <p>生成后这里会显示可直接照着摆放的拼豆图纸。</p>
        </div>
        <canvas id="patternCanvas" hidden></canvas>
      </div>

      <div class="stats">
        <div class="stat"><span>总拼豆</span><strong id="totalBeads">—</strong></div>
        <div class="stat"><span>使用颜色</span><strong id="usedColors">—</strong></div>
        <div class="stat"><span>图纸尺寸</span><strong id="patternSize">—</strong></div>
        <div class="stat"><span>实物尺寸</span><strong id="physicalSize">—</strong></div>
      </div>

      <div class="legend">
        <div class="legend-head"><h2 id="legendTitle">颜色清单</h2><span id="resolutionHint">按原图比例采样</span></div>
        <div id="colorTable" class="color-table">
          <div class="table-empty">生成图纸后显示颜色编号、名称、HEX 和数量。</div>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
